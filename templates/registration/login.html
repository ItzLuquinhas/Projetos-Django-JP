{% extends 'base.html' %}

{% block titulo %}Entrar | Apex Garage{% endblock %}

{% block conteudo %}
<section class="container secao">
    <div class="caixa-form">
        <h1>Entrar</h1>
        {% if next %}
            <p class="aviso">Faça login para ver os detalhes deste anúncio.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_div }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-vermelho largo">Entrar</button>
        </form>

        <p class="rodape-form">Ainda não tem conta? <a href="{% url 'cadastro' %}">Criar conta</a></p>
    </div>
</section>
{% endblock %}
